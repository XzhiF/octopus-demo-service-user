server:
  port: ${SERVICE_USER_PORT:18082}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:octopus_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:octopus}
    password: ${MYSQL_PASSWORD:octopus}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

octopus:
  jwt:
    secret-key: "octopus-demo-login-dev-secret-key-change-me-32+"
    expiration-days: 30